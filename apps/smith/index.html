<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Smith</title>
    <!-- A black mark on a light tab strip, a white one on a dark strip. The
         browser checks media itself, also when the system scheme changes. -->
    <link
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="h-svh overflow-hidden bg-background text-foreground antialiased">
    <div id="app" class="h-full min-h-0 overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
