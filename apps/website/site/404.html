<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Smith</title>
    <!-- A black mark on a light tab strip, a white one on a dark strip. The
         browser checks media itself, also when the system scheme changes. -->
    <link
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><a href="/">Go to the Smith home page</a></p>
    </main>
  </body>
</html>
