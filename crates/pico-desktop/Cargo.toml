[package]
name = "pico-desktop"
version = "0.14.1"
edition = "2024"
description = "Native GPUI desktop client for Pico"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "dc2943fac0ee9b907e21cc415867bd45615c220c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "dc2943fac0ee9b907e21cc415867bd45615c220c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "dc2943fac0ee9b907e21cc415867bd45615c220c" }
gpui_ghostty_terminal = { git = "https://github.com/Xuanwo/gpui-ghostty", rev = "e3025981c6211dd7db2a825dc364ffb5d342f45e" }
lsp-types = "0.97"
notify-rust = "4.12"
reqwest = { version = "0.12", features = [
  "blocking",
  "json",
  "rustls-tls",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2.5"
