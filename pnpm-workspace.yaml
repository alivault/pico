packages:
  - apps/*
  - apps/pico/server

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
onlyBuiltDependencies:
  - esbuild
  - protobufjs
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  encoding-sniffer: 1.0.2
  node-domexception: link:./vendor/node-domexception
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
